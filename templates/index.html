<!DOCTYPE html>
{% load static %}

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>AI Steam Recommender</title>
        <link rel="icon" href="{%static 'images/favicon.svg' %}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'stylesheets/index.css' %}">
        <script src="{% static 'script/index.js' %}"></script>
    </head>

    <body class="page-body">
        <div class="header-section">
            <div><img class="logo_image" src="{% static 'images/favicon_color.svg' %}" alt="icon"></div>
            <div><h1 class="header-title">Steam Recommender</h1></div>
            <button onclick="window.location.href='{% url 'faq' %}'" class="faq_btn" id="faq_btn_id">
                <img class="faq_image" src="{% static 'images/question_color.svg' %}" alt="faq">
            </button>
        </div>

        <div class="url-input">
            <h3>Enter Steam Profile URL:</h3>
            <div style="display: flex; justify-content: center">
                <input type="text" value="" id="steam_url_input" onfocusin="focus_in()" onfocusout="focus_out()" placeholder="https://steamcommunity.com/...">
                <button id="submit_url_btn" onclick="validate_url()">Submit</button>
            </div>
        </div>

        <div class="invalid-label" id="err_url_label">
            <h2>Invalid URL</h2>
        </div>

        <div class="extra-display" id="ext_display">
            <h3>Valid Steam URL Formats:<br><br>    - https://steamcommunity.com/profiles/76561....<br>    - https://steamcommunity.com/id/abc123...</h3>
        </div>
    </body>

</html>
