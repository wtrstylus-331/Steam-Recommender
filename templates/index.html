<!DOCTYPE html>
{% load static %}

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>AI Steam Recommender</title>
        <link rel="icon" href="{%static 'favicon.svg' %}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <style>
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }

        ::-webkit-scrollbar {
            background-color: #131924;
            width: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: slateblue;
            border-radius: 5px;
            box-shadow: black 0 3px 1px;
        }

        .header-section {
            display: flex;
            background: #131924;
            border-radius: 0 0 10px 10px;
            box-shadow: rgba(0, 0, 0, 0.7) 0 3px 5px;
            animation: 1s ease-out 0s header-drop;
            position: relative;
            align-items: center;
            justify-content: flex-start;
            padding-left: 7px;
        }

        @keyframes header-drop {
            0% {top: -70px;}
            100% {top: 0;}
        }

        .header-title {
            background: linear-gradient(45deg, #5132ad, #42a3e4);
            background-clip: text;
            color: transparent;
            font-weight: bolder;
            font-size: 35px;
            position: relative;
            margin: 5px 5px 8px 3px;
            text-shadow: rgba(255, 255, 255, 0.25) 0 0 6px;
        }

        .page-body {
            background-color: #1c2944;
        }

        .logo_image {
            background: linear-gradient(45deg, #3c2054, #5132ad);
            border-radius: 7px;
            padding: 0 3px 3px;
            width: 40px;
            height: 40px;
            margin: 5px 5px 0 1px;
            box-shadow: rgba(255, 255, 255, 0.15) 0 0 6px;
        }

        .faq_btn {
            margin-left: auto;
            background: transparent;
            border: transparent;
            padding: 0;
            display: flex;
            justify-content: center;
            margin-right: 9px;
            margin-top: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition-duration: 250ms;
        }

        .faq_btn:hover{
            box-shadow: rgba(255, 255, 255, 0.2) 1px 2px 10px;
            .faq_image {
                transition-duration: 250ms;
                width: 38px;
                height: 38px;
            }
        }

        .faq_image {
            background: linear-gradient(45deg, #3c2054, #5132ad);
            border-radius: 7px;
            padding: 4px 6px 4px 6px;
            width: 35px;
            height: 35px;
            box-shadow: rgba(255, 255, 255, 0.15) 0 0 6px;
        }

    </style>

    <body class="page-body">
        <div class="header-section">
            <div><img class="logo_image" src="{% static 'favicon_color.svg' %}" alt="icon"></div>
            <div><h1 class="header-title">Steam Recommender</h1></div>
            <button onclick="window.location.href='{% url 'faq' %}'" class="faq_btn" id="faq_btn_id">
                <img class="faq_image" src="{% static 'question_color.svg' %}" alt="faq">
            </button>
        </div>

        <div class="faq-section">
        </div>
    </body>

</html>
